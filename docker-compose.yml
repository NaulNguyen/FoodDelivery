version: '3.8'

services:
  fooddelivery-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=FoodDeliveryDb;User=root;Password=your_password;AllowUserVariables=True;SslMode=none
      - ConnectionStrings__Redis=redis:6379
    depends_on:
      - db
      - redis
    networks:
      - fooddelivery_network

  db:
    image: mysql:8.0
    container_name: fooddelivery_db
    environment:
      - MYSQL_ROOT_PASSWORD=your_password
      - MYSQL_DATABASE=FoodDeliveryDb
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - fooddelivery_network

  redis:
    image: redis:alpine
    container_name: fooddelivery_redis
    ports:
      - "6379:6379"
    networks:
      - fooddelivery_network

networks:
  fooddelivery_network:
    driver: bridge

volumes:
  db_data:
